; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
upload_port = COM11
upload_speed = 921600
monitor_speed = 115200
monitor_port = COM11
framework = arduino
lib_ldf_mode = deep+

; Patcht die Adafruit_VL53L0X-Library vor dem Build an zwei Stellen:
;  1. Der Adresswechsel auf die Zieladresse wird VOR DataInit ausgefuehrt.
;     DataInit liest die NVM-Kalibrierdaten - im Originaltreiber noch auf der
;     Default-Adresse 0x29, wo auch der TCS34725 haengt. Dessen Antworten
;     verfaelschen die Reads, StaticInit scheitert mit -50 (REF_SPAD_INIT).
;  2. Eine oeffentliche Methode, um die Ref-SPAD-Kalibrierung erneut zu
;     starten (DISTREF) - der einzige Weg, einen Sensor mit beschaedigten
;     NVM-Daten ohne Loeten zurueckzuholen.
; Siehe patch_vl53l0x.py und README.
extra_scripts = pre:patch_vl53l0x.py

lib_deps =
	adafruit/Adafruit TCS34725@^1.4.0
	adafruit/Adafruit_VL53L0X@^1.2.5
	waspinator/AccelStepper@^1.64
	adafruit/Adafruit NeoPixel@^1.12.3
	teemuatlut/TMCStepper@^0.7.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
    -Wextra

 
