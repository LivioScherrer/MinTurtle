; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
upload_port = COM11
framework = arduino
lib_ldf_mode = deep+

; Patcht die Adafruit_VL53L0X-Library vor dem Build: die Kommunikationsadresse
; wird auf die vom Aufrufer gewaehlte Adresse gesetzt statt fest auf 0x29.
; Ohne das kollidieren VL53L0X und TCS34725 beim Boot beide auf 0x29 und
; verfaelschen sich gegenseitig die NVM-Kalibrierdaten (-50 REF_SPAD_INIT).
; Siehe patch_vl53l0x.py und README.
extra_scripts = pre:patch_vl53l0x.py

lib_deps =
	adafruit/Adafruit TCS34725@^1.4.0
	adafruit/Adafruit_VL53L0X@^1.2.5
	waspinator/AccelStepper@^1.64
	adafruit/Adafruit NeoPixel@^1.12.3
	teemuatlut/TMCStepper@^0.7.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

 
